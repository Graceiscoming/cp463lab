[project]
name = "cp463-lab"
version = "0.1.0"
description = "CP463 lab tutorials: perceptron, neural network และ CNN ด้วย numpy / scikit-learn / PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.7,<2",
    "matplotlib>=3.10,<4",
    "torch>=2.5,<3",
    "torchvision>=0.20,<1",
    "jupyterlab>=4.4,<5",
    "ipykernel>=6,<7",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pyarrow>=17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnlab"]

[tool.uv]
default-groups = ["dev"]

# บน Linux ให้ดึง torch แบบ CPU-only (กันดาวน์โหลด CUDA ~2GB)
# macOS และ Windows ใช้ wheel ปกติจาก PyPI
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow' -q"
markers = [
    "slow: execute ทุก notebook (ช้า) รันด้วย  uv run pytest -m slow",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
